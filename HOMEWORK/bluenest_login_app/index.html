<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueNest — Đăng nhập & Đăng ký</title>
<style>
:root{--blue:#3865e8;--blue2:#274fcb;--ink:#18264b;--muted:#71809c;--line:#dce3ef;--bg:#f1f5ff;--white:#fff;--danger:#b42318;--success:#067647}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 12%,#dce7ff 0 100px,transparent 102px),radial-gradient(circle at 90% 85%,#dfe8ff 0 150px,transparent 152px),linear-gradient(135deg,#f6f8ff,#eaf0ff);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:28px clamp(20px,6vw,80px)}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#4f7cff,#3157d5);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}.brand{font-weight:800;font-size:23px;letter-spacing:-.5px}
main{flex:1;display:grid;place-items:center;padding:8px 20px 44px}.card{width:min(100%,460px);background:#fff;border:1px solid #ffffffb0;border-radius:24px;padding:38px 40px;box-shadow:0 18px 50px #243b7018}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}.title{font-size:30px;letter-spacing:-.8px;margin:10px 0 8px}.subtitle{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 26px}
.field{margin:0 0 17px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:49px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:14px;outline:none;transition:.18s}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3865e81a}.field input::placeholder{color:#9aa6ba}.rowline{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin:4px 0 22px}.remember{display:flex;align-items:center;gap:7px}.remember input{accent-color:var(--blue)}button{font:inherit;cursor:pointer}.primary{width:100%;height:51px;border:0;border-radius:11px;color:white;font-weight:750;background:linear-gradient(100deg,#4f7cff,#3157d5);box-shadow:0 8px 18px #3865e82a;transition:transform .15s,filter .15s}.primary:hover{filter:brightness(1.04);transform:translateY(-1px)}.switch{text-align:center;color:var(--muted);font-size:13px;margin:23px 0 0}.text-button,.link{border:0;background:none;color:var(--blue);font-weight:750;padding:0}.text-button:hover,.link:hover{text-decoration:underline}.message{display:none;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.5;margin:0 0 16px}.message.error{display:block;color:var(--danger);background:#fff1f0}.message.success{display:block;color:var(--success);background:#ecfdf3}.demo{margin-top:20px;border:1px dashed #c8d5f3;border-radius:12px;background:#f8faff;padding:12px;font-size:12px;color:#64748b;line-height:1.55}.demo strong{color:var(--ink)}.demo button{margin-top:7px;border:0;background:none;color:var(--blue);font-weight:700;padding:0}footer{text-align:center;color:#71809c;font-size:12px;padding:0 20px 22px}
@media(max-width:480px){header{padding:20px}.card{padding:30px 22px;border-radius:20px}.title{font-size:27px}.rowline{align-items:flex-start}.demo{font-size:11px}}
</style>
</head>
<body>
<header><div class="logo">✓</div><div class="brand">BlueNest</div></header>
<main><section class="card" aria-live="polite" id="app"></section></main>
<footer>Đơn giản · An toàn · Dễ sử dụng</footer>
<script>
const app=document.getElementById('app');
const KEY='bluenest_demo_users_v1';
function users(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function saveUsers(list){localStorage.setItem(KEY,JSON.stringify(list))}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMessage(text,type='error'){const box=document.getElementById('message');if(box){box.textContent=text;box.className='message '+type}}
function renderLogin(note=''){
app.innerHTML=`<div class="eyebrow">Chào mừng bạn trở lại</div><h1 class="title">Đăng nhập</h1><p class="subtitle">Đăng nhập để tiếp tục hành trình của bạn.</p><div id="message" class="message"></div><form id="loginForm" novalidate><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label for="loginPassword">Mật khẩu</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required minlength="6"></div><div class="rowline"><label class="remember"><input id="remember" type="checkbox"> Ghi nhớ đăng nhập</label><button type="button" class="link" id="forgot">Quên mật khẩu?</button></div><button class="primary" type="submit">Đăng nhập</button></form><p class="switch">Chưa có tài khoản? <button class="text-button" id="goSignup">Đăng ký ngay</button></p><div class="demo"><strong>Chế độ thực hành</strong><br>Tài khoản được lưu trên trình duyệt này để bạn thử giao diện. Không dùng mật khẩu thật.<br><button id="fillDemo" type="button">Điền tài khoản mẫu</button></div>`;
if(note)showMessage(note,'success');
document.getElementById('goSignup').onclick=()=>renderSignup();
document.getElementById('forgot').onclick=()=>showMessage('Đây là bản demo chưa có chức năng gửi email đặt lại mật khẩu.','error');
document.getElementById('fillDemo').onclick=()=>{document.getElementById('loginEmail').value='demo@bluenest.local';document.getElementById('loginPassword').value='Demo123';};
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('loginEmail').value.trim().toLowerCase(),pass=document.getElementById('loginPassword').value; if(!email||!pass)return showMessage('Vui lòng nhập email và mật khẩu.');const u=users().find(x=>x.email===email&&x.password===pass);if(!u)return showMessage('Email hoặc mật khẩu không đúng. Hãy đăng ký tài khoản demo trước.');renderDashboard(u.name,email);};
}
function renderSignup(note=''){
app.innerHTML=`<div class="eyebrow">Bắt đầu miễn phí</div><h1 class="title">Tạo tài khoản</h1><p class="subtitle">Điền thông tin bên dưới để tạo tài khoản BlueNest.</p><div id="message" class="message"></div><form id="signupForm" novalidate><div class="field"><label for="fullName">Họ và tên</label><input id="fullName" autocomplete="name" placeholder="Nguyễn Văn A" required maxlength="80"></div><div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label for="signupPassword">Mật khẩu</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required minlength="6"></div><div class="field"><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required minlength="6"></div><div class="rowline"><label class="remember"><input id="terms" type="checkbox"> Tôi đồng ý với điều khoản demo</label></div><button class="primary" type="submit">Tạo tài khoản</button></form><p class="switch">Đã có tài khoản? <button class="text-button" id="goLogin">Đăng nhập</button></p><div class="demo">Bản thực hành lưu thông tin trong bộ nhớ cục bộ của trình duyệt. Không nhập mật khẩu bạn đang sử dụng ở nơi khác.</div>`;
if(note)showMessage(note,'success');
document.getElementById('goLogin').onclick=()=>renderLogin();
document.getElementById('signupForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('fullName').value.trim(),email=document.getElementById('signupEmail').value.trim().toLowerCase(),pass=document.getElementById('signupPassword').value,confirm=document.getElementById('confirmPassword').value;if(name.length<2)return showMessage('Vui lòng nhập họ tên hợp lệ.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showMessage('Vui lòng nhập địa chỉ email hợp lệ.');if(pass.length<6)return showMessage('Mật khẩu cần ít nhất 6 ký tự.');if(pass!==confirm)return showMessage('Mật khẩu xác nhận không khớp.');if(!document.getElementById('terms').checked)return showMessage('Vui lòng chọn đồng ý với điều khoản demo.');const list=users();if(list.some(x=>x.email===email))return showMessage('Email này đã đăng ký. Hãy đăng nhập.');list.push({name,email,password:pass});try{saveUsers(list)}catch{return showMessage('Trình duyệt không cho lưu dữ liệu. Hãy bật bộ nhớ cục bộ hoặc dùng trình duyệt khác.')}renderLogin('Tạo tài khoản thành công! Bạn có thể đăng nhập bằng tài khoản vừa tạo.');};
}
function renderDashboard(name,email){app.innerHTML=`<div class="eyebrow">Đăng nhập thành công</div><h1 class="title">Xin chào, ${safe(name)}!</h1><p class="subtitle">Bạn đã đăng nhập vào bản demo BlueNest.</p><div class="demo"><strong>Thông tin tài khoản</strong><br>Email: ${safe(email)}<br>Đây chỉ là trạng thái đăng nhập mô phỏng trên trình duyệt hiện tại.</div><button class="primary" style="margin-top:22px" id="logout">Đăng xuất</button><p class="switch">Muốn thử tài khoản khác? Bạn có thể đăng xuất bên dưới.</p>`;document.getElementById('logout').onclick=()=>renderLogin('Bạn đã đăng xuất.');}
renderLogin();
</script>
</body>
</html>
